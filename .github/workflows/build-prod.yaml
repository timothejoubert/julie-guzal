name: Deploy prod

on:
    push:
        tags: ['**']

    repository_dispatch:
        types:
            - custom_bruno_trigger # manual or test trigger (e.g. Bruno)
            - preprod_api_publish_trigger # legacy trigger, kept for compatibility with existing senders
            - netlify_function_publish_trigger # sent by the Netlify function (netlify/functions/run-gh-dispatches.mts)

# Cancel previous deploys to avoid build stacking
concurrency:
    group: deploy-prod
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: 'package.json'

            # Reads the pnpm version from package.json "packageManager"
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              name: Install pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint scripts
              run: pnpm lint:js

            - name: Lint styles
              run: pnpm lint:css

            - name: Generate static site
              run: pnpm generate
              env:
                  NUXT_PUBLIC_SITE_NAME: Julie Guzal
                  NUXT_PUBLIC_SITE_ENV: production
                  NUXT_PUBLIC_SITE_URL: https://julieguzal.fr

            - name: Upload artifacts for deployment job
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: SSG_APP
                  include-hidden-files: true # allow .htaccess file
                  path: |
                      .output/public
                      !.output/public/.env
                  if-no-files-found: error

            - run: ls -lah .output/public

    SFTP-Deploy-Action:
        name: SFTP-Deploy-Action
        needs: build
        runs-on: ubuntu-latest
        steps:
            # The deployer requires a git work tree (it runs `git rev-parse`)
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Download SSG_APP artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: SSG_APP
                  path: .output/public

            - name: Display structure of downloaded files
              run: ls -R

            # Third-party action receiving the OVH credentials: keep it pinned by SHA
            - name: SFTP deploy
              uses: milanmk/actions-file-deployer@b204fec5b826c391b116c40b789df470a4fb6870 # 1.18
              with:
                  remote-protocol: sftp
                  # Credentials for SFTP access to server using GitHub secrets
                  remote-host: ${{ secrets.FTP_HOST }}
                  remote-user: ${{ secrets.FTP_USER }}
                  remote-password: ${{ secrets.FTP_PASSWORD }}
                  # Path for specific folder on server for files deployment
                  local-path: .output/public
                  remote-path: /home/juliegd/www
                  # Transfer all files (useful for first deploy)
                  sync: full
                  # Port for SFTP access to server
                  remote-port: 22
