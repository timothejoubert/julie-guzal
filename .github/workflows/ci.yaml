name: CI

# Checks every pull request and every push to develop (commits land there directly):
# lint + static generation + Lighthouse audit of the generated pages.
# Deployment stays in build-prod.yaml (tags / repository_dispatch).

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop, main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Reads the pnpm version from package.json "packageManager"
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint scripts
              run: pnpm lint:js

            - name: Lint styles
              run: pnpm lint:css

            # Fetches content from the public Prismic API, like the production build
            - name: Generate static site
              run: pnpm generate
              env:
                  NUXT_PUBLIC_SITE_NAME: Julie Guzal
                  NUXT_PUBLIC_SITE_ENV: staging
                  NUXT_PUBLIC_SITE_URL: https://julieguzal.fr

            # Audits the generated pages (thresholds in lighthouserc.cjs). Chrome is preinstalled on ubuntu runners.
            - name: Lighthouse audit
              run: pnpm lhci

            - name: Upload Lighthouse reports
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: lighthouse-reports
                  path: .lighthouseci
                  retention-days: 14
